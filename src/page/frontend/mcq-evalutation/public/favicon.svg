<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="#0d3b5e"/>

  <!-- Ear tips -->
  <circle cx="9"  cy="7.5" r="2.5" fill="#a8d8ea"/>
  <circle cx="23" cy="7.5" r="2.5" fill="#a8d8ea"/>

  <!-- Binaurals -->
  <path d="M9 10 C9 14 14 14 16 14"  fill="none" stroke="#a8d8ea" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M23 10 C23 14 18 14 16 14" fill="none" stroke="#a8d8ea" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Tube vertical -->
  <line x1="16" y1="14" x2="16" y2="21.5" stroke="#a8d8ea" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Chest piece -->
  <circle cx="16" cy="25.5" r="4.5" fill="#a8d8ea"/>
  <circle cx="16" cy="25.5" r="2"   fill="#0d3b5e"/>
</svg>
