services:

  # ── API FastAPI ─────────────────────────────────────────────────────────
  backend:
    build: ./src/page/backend
    env_file: ./src/page/backend/.env
    environment:
      # Autoriser les requêtes venant du frontend nginx
      ALLOWED_ORIGINS: http://localhost
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Persistance : base SQLite + CSVs MCQs + custom_mcqs + users.json
      - ./src/page/backend/data:/app/data
    restart: unless-stopped

  # ── Frontend Angular (build + nginx) ───────────────────────────────────
  frontend:
    build: ./src/page/frontend/mcq-evalutation
    ports:
      - "8081:80"
    depends_on:
      - backend
    restart: unless-stopped
